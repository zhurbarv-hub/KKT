<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#grad)"/>
  <g fill="white">
    <!-- Cash register body -->
    <rect x="96" y="192" width="320" height="224" rx="16"/>
    <!-- Screen -->
    <rect x="128" y="224" width="176" height="80" rx="8" fill="#1e1b4b"/>
    <!-- Receipt slot -->
    <rect x="144" y="96" width="144" height="112" rx="8" fill="white"/>
    <rect x="160" y="112" width="112" height="80" fill="#f5f3ff"/>
    <!-- Receipt lines -->
    <rect x="176" y="128" width="80" height="8" rx="2" fill="#c4b5fd"/>
    <rect x="176" y="144" width="64" height="8" rx="2" fill="#c4b5fd"/>
    <rect x="176" y="160" width="72" height="8" rx="2" fill="#c4b5fd"/>
    <!-- Keypad -->
    <rect x="328" y="224" width="56" height="40" rx="6" fill="#1e1b4b"/>
    <rect x="328" y="280" width="56" height="40" rx="6" fill="#1e1b4b"/>
    <rect x="328" y="336" width="56" height="40" rx="6" fill="#10b981"/>
    <!-- Display text -->
    <text x="216" y="274" font-family="monospace" font-size="32" fill="#10b981" text-anchor="middle">ККТ</text>
  </g>
</svg>
