<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Релабс Центр</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,600,700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="/static/css/styles.css?v=6.1&t=20260118_2245">
    <style>
        /* Специфичные стили для страницы входа */
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-600) 0%, var(--primary-800) 100%);
            padding: var(--space-4);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: var(--color-surface);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-2xl);
            overflow: hidden;
            animation: slideUp 0.4s var(--ease-out);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, var(--primary-500) 0%, var(--primary-700) 100%);
            padding: var(--space-8) var(--space-6);
            text-align: center;
            color: white;
        }

        .login-header h1 {
            margin: 0;
            font-size: var(--text-3xl);
            font-weight: var(--font-bold);
            letter-spacing: -0.02em;
        }

        .login-header p {
            margin: var(--space-2) 0 0;
            font-size: var(--text-sm);
            opacity: 0.9;
            font-weight: var(--font-normal);
        }

        .login-body {
            padding: var(--space-8) var(--space-6);
        }

        .form-group {
            margin-bottom: var(--space-5);
        }

        .form-group label {
            display: block;
            margin-bottom: var(--space-2);
            font-size: var(--text-sm);
            font-weight: var(--font-semibold);
            color: var(--neutral-700);
        }

        .form-input {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            font-size: var(--text-base);
            font-family: inherit;
            border: 2px solid var(--neutral-200);
            border-radius: var(--radius-lg);
            background: var(--color-surface);
            color: var(--color-text);
            transition: all var(--duration-base) var(--ease-out);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-500);
            box-shadow: 0 0 0 4px var(--primary-100);
        }

        .form-input::placeholder {
            color: var(--neutral-400);
        }

        .error-message {
            margin-top: var(--space-4);
            padding: var(--space-3) var(--space-4);
            background: var(--error-50);
            border: 1px solid var(--error-200);
            border-radius: var(--radius-lg);
            color: var(--error-700);
            font-size: var(--text-sm);
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.4s var(--ease-out);
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        .login-button {
            width: 100%;
            padding: var(--space-4);
            margin-top: var(--space-6);
            font-size: var(--text-base);
            font-weight: var(--font-semibold);
            color: white;
            background: linear-gradient(135deg, var(--primary-500) 0%, var(--primary-700) 100%);
            border: none;
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all var(--duration-base) var(--ease-out);
            box-shadow: var(--shadow-md);
        }

        .login-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-primary);
        }

        .login-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-footer {
            margin-top: var(--space-6);
            text-align: center;
            color: white;
            font-size: var(--text-sm);
            opacity: 0.9;
        }

        .login-footer p {
            margin: 0;
        }

        #loadingSpinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
        }

        /* Адаптивность */
        @media (max-width: 480px) {
            .login-page {
                padding: var(--space-3);
            }

            .login-header {
                padding: var(--space-6) var(--space-4);
            }

            .login-header h1 {
                font-size: var(--text-2xl);
            }

            .login-body {
                padding: var(--space-6) var(--space-4);
            }
        }
    </style>
</head>

<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Релабс Центр</h1>
                <p>Система управления дедлайнами ККТ</p>
            </div>
            <div class="login-body">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Логин</label>
                        <input type="text" id="username" name="username" class="form-input" placeholder="Введите логин"
                            required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <input type="password" id="password" name="password" class="form-input"
                            placeholder="Введите пароль" required autocomplete="current-password">
                    </div>
                    <div id="errorMessage" class="error-message"></div>
                    <button type="submit" class="login-button" id="loginBtn">
                        Войти
                    </button>
                </form>
            </div>
        </div>
        <div class="login-footer">
            <p>© 2026 Релабс Центр. Все права защищены.</p>
        </div>
    </div>

    <div id="loadingSpinner" style="display: none;">
        <div
            style="width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite;">
        </div>
    </div>

    <style>
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>

    <script src="/static/js/auth.js"></script>
</body>

</html>
