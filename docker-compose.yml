services:
  postgres:
    image: postgres:16-alpine
    container_name: kkt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-kkt_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-kkt_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /home/kktapp/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kkt_user} -d ${DB_NAME:-kkt_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kkt-network

  redis:
    image: redis:7-alpine
    container_name: kkt-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kkt-network

  backend:
    image: ghcr.io/zhurbarv-hub/kkt-backend:latest
    container_name: kkt-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-kkt_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-kkt_production}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      telegram_bot_token: ${telegram_bot_token}
      telegram_admin_ids: ${telegram_admin_ids}
      ENVIRONMENT: production
      IS_MASTER: ${IS_MASTER:-false}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kkt-network

  bot:
    image: ghcr.io/zhurbarv-hub/kkt-bot:latest
    container_name: kkt-bot
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-kkt_user}:${DB_PASSWORD}@172.20.0.1:5432/${DB_NAME:-kkt_production}
      REDIS_URL: redis://redis:6379/1
      REDIS_HOST: redis
      telegram_bot_token: ${telegram_bot_token}
      telegram_admin_ids: ${telegram_admin_ids}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      WEB_API_BASE_URL: http://172.20.0.1:8000
      NOTIFICATION_TIMEZONE: Europe/Moscow
      NOTIFICATION_CHECK_TIME: "09:00"
      NOTIFICATION_DAYS: "14,7,3"
      NOTIFICATION_INCLUDE_ADMINS: "true"
      ADMIN_SUMMARY_ENABLED: "true"
      BOT_API_USERNAME: ${BOT_API_USERNAME:-bot-service@kkt-system.ru}
      BOT_API_PASSWORD: ${BOT_API_PASSWORD:-BotService2026Secure}
    volumes:
      - ./bot:/app/bot
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kkt-network

  deployer:
    image: ghcr.io/zhurbarv-hub/kkt-deployer:latest
    container_name: kkt-deployer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/kktapp/kkt-system:/opt/kkt
      - /home/kktapp/kkt-system/deployment-service/main.py:/app/main.py:ro
    environment:
      INSTALL_DIR: /opt/kkt
      IS_MASTER: ${IS_MASTER:-false}
    networks:
      - kkt-network
    profiles:
      - master

  watchtower:
    image: containrrr/watchtower
    container_name: kkt-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_LABEL_ENABLE: "false"
    command: kkt-backend kkt-bot
    profiles:
      - client

volumes:
  postgres_data:
  redis_data:

networks:
  kkt-network:
    driver: bridge
