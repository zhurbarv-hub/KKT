version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kkt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-kkt_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-kkt_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /home/kktapp/backups:/backups
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kkt_user} -d ${DB_NAME:-kkt_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kkt-network

  redis:
    image: redis:7-alpine
    container_name: kkt-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kkt-network

  backend:
    image: ghcr.io/zhurbarv-hub/kkt-backend:latest
    container_name: kkt-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-kkt_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-kkt_production}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENVIRONMENT: production
      IS_MASTER: ${IS_MASTER:-false}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kkt-network

  bot:
    image: ghcr.io/zhurbarv-hub/kkt-bot:latest
    container_name: kkt-bot
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-kkt_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-kkt_production}
      REDIS_URL: redis://redis:6379/1
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kkt-network

  deployer:
    image: ghcr.io/zhurbarv-hub/kkt-deployer:latest
    container_name: kkt-deployer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/kktapp/kkt-system:/opt/kkt
    environment:
      INSTALL_DIR: /opt/kkt
      IS_MASTER: ${IS_MASTER:-false}
    networks:
      - kkt-network
    profiles:
      - master

  # Автообновление (только для клиентских систем)
  watchtower:
    image: containrrr/watchtower
    container_name: kkt-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_LABEL_ENABLE: "false"
    command: kkt-backend kkt-bot
    profiles:
      - client

volumes:
  postgres_data:
  redis_data:

networks:
  kkt-network:
    driver: bridge
