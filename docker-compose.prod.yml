services:
  postgres:
    image: postgres:16-alpine
    container_name: kkt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-kkt_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-kkt_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kkt_user} -d ${DB_NAME:-kkt_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kkt-network

  redis:
    image: redis:7-alpine
    container_name: kkt-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kkt-network

  backend:
    image: ghcr.io/zhurbarv-hub/kkt-backend:latest
    container_name: kkt-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-kkt_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-kkt_production}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      telegram_bot_token: ${TELEGRAM_BOT_TOKEN}
      telegram_admin_ids: ${ADMIN_TELEGRAM_IDS}
      ENVIRONMENT: production
      IS_MASTER: ${IS_MASTER:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kkt-network

  bot:
    image: ghcr.io/zhurbarv-hub/kkt-bot:latest
    container_name: kkt-bot
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-kkt_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-kkt_production}
      REDIS_URL: redis://redis:6379/1
      telegram_bot_token: ${TELEGRAM_BOT_TOKEN}
      telegram_admin_ids: ${ADMIN_TELEGRAM_IDS}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kkt-network

  nginx:
    image: ghcr.io/zhurbarv-hub/kkt-frontend:latest
    container_name: kkt-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - kkt-network

  deployer:
    image: ghcr.io/zhurbarv-hub/kkt-deployer:latest
    container_name: kkt-deployer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/opt/kkt
    environment:
      INSTALL_DIR: /opt/kkt
      IS_MASTER: ${IS_MASTER:-false}
    networks:
      - kkt-network
    profiles:
      - master

  watchtower:
    image: containrrr/watchtower
    container_name: kkt-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_LABEL_ENABLE: "false"
      DOCKER_API_VERSION: "1.44"
    command: kkt-backend kkt-bot kkt-nginx
    profiles:
      - client

volumes:
  postgres_data:
  redis_data:

networks:
  kkt-network:
    driver: bridge
